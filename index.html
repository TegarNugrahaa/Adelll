<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Memories ♡</title>
<style>
  *{box-sizing:border-box}
  :root{--glow:#a83dff;--soft:#ff77a2}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:white;font-family:Arial,Helvetica,sans-serif}
  body{display:grid;place-items:center}
  .scene{position:relative;width:100vw;height:100dvh;overflow:hidden;background:
    radial-gradient(ellipse at 50% 48%,rgba(81,13,37,.19),transparent 48%),
    linear-gradient(180deg,#050507,#09070b 70%,#050507);isolation:isolate}
  .grain{position:absolute;inset:-50%;opacity:.08;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");z-index:5}
  .intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:10;background:#050507;animation:introOut 1.1s ease 4.2s forwards}
  .music-panel{position:absolute;left:14px;top:55px;width:250px;max-width:calc(100vw - 28px);padding:10px 12px 8px;z-index:21;border:1px solid #ffffff22;border-radius:12px;background:#120911;box-shadow:0 12px 35px #0009;display:none}
  .music-panel.show{display:block}
  .music-panel audio{width:100%;display:block;outline:none;border-radius:8px}
  .music-panel .label{display:block;margin-bottom:8px;font-size:10px;letter-spacing:2px;color:#f3bfd2;text-transform:uppercase}
  .music-btn{position:absolute;left:14px;top:14px;z-index:20;border:1px solid #ffffff24;background:#ffffff0b;color:#f4c4d4;border-radius:20px;padding:8px 12px;font-size:11px;cursor:pointer;backdrop-filter:blur(8px)}
  .orb{width:28px;height:28px;border-radius:50%;background:#fff;opacity:.3;box-shadow:0 0 0 9px #ffffff08,0 0 30px #fff6;animation:breathe 1.5s infinite}
  .heart{font-size:31px;color:var(--glow);text-shadow:0 0 20px var(--glow);animation:beat .9s infinite;opacity:0;animation-delay:1s}
  .loading{font-size:10px;letter-spacing:7px;color:#a83c62;text-transform:uppercase;animation:fadeIn 1s ease .8s forwards;opacity:0}
  .line{width:140px;height:1px;background:#451626;position:relative;overflow:hidden}
  .line:after{content:"";position:absolute;left:-40%;top:0;width:40%;height:100%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:load 2.8s ease-in-out infinite}
  .dots{font-size:12px;letter-spacing:6px;color:#b7446d;animation:blink 1s infinite}
  .words{position:absolute;inset:-5%;filter:drop-shadow(0 0 8px #ff246b20);transition:filter 2s}
  .word{position:absolute;color:var(--glow);font-size:clamp(10px,2.2vw,18px);font-weight:300;opacity:0;white-space:nowrap;text-shadow:0 0 12px currentColor;animation:wordIn 1.5s ease forwards,float 8s ease-in-out infinite}
  .word.small{font-size:clamp(8px,1.4vw,13px);opacity:0.6}
  .photo{position:absolute;width:clamp(66px,17vw,125px);aspect-ratio:1/1.08;object-fit:cover;border-radius:12px;border:1px solid #ffffff28;box-shadow:0 12px 36px #000b,0 0 22px #ff477b15;opacity:0;transform:scale(.8) rotate(var(--rot));animation:photoIn 1.5s cubic-bezier(.2,.8,.2,1) forwards,photoFloat 7s ease-in-out infinite;filter:saturate(.85) brightness(.86)}
  .photo:after{content:"";position:absolute}
  .photo.p1{left:9%;top:28%;--rot:-5deg;animation-delay:5.4s,6.9s}
  .photo.p2{right:9%;top:42%;--rot:6deg;animation-delay:6s,7.5s}
  .photo.p3{left:20%;bottom:12%;--rot:4deg;animation-delay:6.5s,8s}
  .photo.p4{right:19%;top:8%;--rot:-7deg;animation-delay:7s,8.5s;width:clamp(50px,12vw,88px)}
  .photo.p5{right:3%;bottom:13%;--rot:-4deg;animation-delay:7.5s,9s;width:clamp(48px,12vw,85px)}
  .photo.p6{left:3%;bottom:35%;--rot:7deg;animation-delay:8s,9.5s;width:clamp(45px,11vw,78px)}
  .center-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:80%;color:#ff5d8b;opacity:0;animation:fadeIn 2s ease 7s forwards;pointer-events:none}
  .center-message h1{font-weight:300;font-size:clamp(18px,4vw,32px);letter-spacing:2px;margin:0 0 12px;text-shadow:0 0 24px #ff347755;display:flex;align-items:center;justify-content:center;gap:8px}
  .center-message .white-love{font-size:1.1em;color:#fff;text-shadow:0 0 16px rgba(255,255,255,.8)}
  .center-message p{font-size:clamp(10px,2vw,14px);letter-spacing:3px;color:#c36b87}
  .photo-modal{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,3,7,.82);backdrop-filter:blur(8px);padding:22px}
  .photo-modal.show{display:flex;animation:fadeIn .25s ease}
  .modal-card{position:relative;max-width:min(88vw,420px);text-align:center;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
  .modal-card img{display:block;max-width:100%;max-height:62vh;object-fit:contain;border:2px solid #ff7ca5;border-radius:16px;box-shadow:0 0 35px #ff3d7950}
  .modal-card p{color:#ff9cbb;letter-spacing:1px;font-size:14px;line-height:1.6;margin-top:12px}
  .close-modal{position:absolute;right:-12px;top:-12px;border:0;border-radius:50%;width:32px;height:32px;background:#ff4d87;color:white;font-size:20px;cursor:pointer}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.55) 100%);z-index:4}
  .toggle{position:absolute;right:14px;top:14px;z-index:20;border:1px solid #ffffff24;background:#ffffff0b;color:#e8b4c5;border-radius:20px;padding:8px 12px;font-size:11px;cursor:pointer;backdrop-filter:blur(8px)}
  .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:2px;color:#76505d;z-index:8;opacity:.75}
  .scene.blue{--glow:#47d9ed;--soft:#8af2ff}
  @keyframes breathe{50%{transform:scale(1.12);opacity:.55}}
  @keyframes beat{50%{transform:scale(1.18)}}
  @keyframes load{to{left:110%}}
  @keyframes blink{50%{opacity:.25}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}}
  @keyframes wordIn{to{opacity:.72}}
  @keyframes float{0%,100%{translate:0 0}50%{translate:8px -13px}}
  @keyframes photoIn{to{opacity:.82;transform:scale(1) rotate(var(--rot))}}
  @keyframes photoFloat{0%,100%{margin-top:0}50%{margin-top:-10px}}
  @media(max-width:500px){.photo.p1{left:7%;top:25%}.photo.p2{right:6%;top:45%}.photo.p3{left:15%;bottom:14%}.photo.p4{right:16%;top:11%}.center-message{top:49%}.hint{font-size:8px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="intro" id="intro">
    <div class="orb"></div>
    <div class="heart">♥</div>
    <div class="loading">Loading memories</div>
    <div class="line"></div>
    <div class="dots">· · ·</div>
  </div>
  <div class="words" id="words"></div>
  <!-- Ganti URL gambar di bawah dengan foto kalian sendiri -->
  <img class="photo p1" src="Adel 1.jpg" alt="Foto kenangan 1">
  <img class="photo p2" src="Adel 2.jpg" alt="Foto kenangan 2">
  <img class="photo p3" src="Adel 3.jpg" alt="Foto kenangan 3">
  <img class="photo p4" src="Adel 4.jpg" alt="Foto kenangan 4">
  <div class="center-message">
    <h1><span>Hello Adel</span><span class="white-love">♡</span></h1>
    <p>YOU ARE BEAUTIFUL · CUTE · LOVELY · ADORABLE</p>
  </div>
  <div class="vignette"></div><div class="grain"></div>
  <div class="photo-modal" id="photoModal" aria-label="Foto Adel">
    <div class="modal-card">
      <button class="close-modal" id="closeModal" aria-label="Tutup">×</button>
      <img id="modalImg" src="" alt="Foto Adel">
      <p id="modalCaption">Hallo Adel, kamu cantik, lucu, imut, dan gemes ♡</p>
    </div>
  </div>
  <button class="music-btn" id="musicBtn">♫ Putar lagu</button>
  <div class="music-panel" id="musicPanel">
    <span class="label">Now playing</span>
    <audio id="bgm" controls autoplay preload="auto" loop>
      <source src="lagu-adel.mp3" type="audio/mpeg">
      Browser kamu tidak mendukung audio HTML5.
    </audio>
  </div>
  <button class="toggle" id="toggle">Ubah warna ✦</button>
  <div class="hint">a little place for our memories ♡</div>
</div>
<script>
const phrases = [
  "you mean everything","stay with me","only you","my favorite person",
  "always on my mind","you are enough","forever","my safe place",
  "i love you","stay with you","you make me smile","just you",
  "you are my favorite","all of my heart","my happy place"
];
const layer = document.getElementById('words');
for(let i=0;i<44;i++){
  const el=document.createElement('span');
  el.className='word'+(i%3===0?' small':'');
  el.textContent=phrases[i%phrases.length];
  el.style.left=(Math.random()*88+3)+'%';
  el.style.top=(Math.random()*92+2)+'%';
  el.style.animationDelay=(5.2+Math.random()*8)+'s,'+(Math.random()*-8)+'s';
  el.style.animationDuration=(1.5+Math.random()*1.5)+'s,'+(7+Math.random()*8)+'s';
  el.style.transform=`rotate(${Math.random()*14-7}deg)`;
  layer.appendChild(el);
}

document.getElementById('toggle').addEventListener('click',()=>{
  document.getElementById('scene').classList.toggle('blue');
});

const modal = document.getElementById('photoModal');
const modalImg = document.getElementById('modalImg');
const modalCaption = document.getElementById('modalCaption');
const photoCaptions = [
  'Hallo Adel, kamu cantik banget ♡',
  'Adel lucu banget, bikin hati gemes ♡',
  'Adel imut dan adorable banget loh ♡',
  'Adel gemes banget, bikin hari jadi lebih indah ♡'
];

document.querySelectorAll('.photo').forEach((photo, index) => {
  photo.addEventListener('click', () => {
    modalImg.src = photo.src;
    modalCaption.textContent = photoCaptions[index % photoCaptions.length];
    modal.classList.add('show');
  });
});

document.getElementById('closeModal').addEventListener('click', () => {
  modal.classList.remove('show');
});

modal.addEventListener('click', (event) => {
  if (event.target === modal) modal.classList.remove('show');
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') modal.classList.remove('show');
});

const audio = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
const musicPanel = document.getElementById('musicPanel');

window.addEventListener('load', async () => {
  try {
    await audio.play();
  } catch (error) {
    console.log('Autoplay diblokir oleh browser, tetapi user bisa klik tombol untuk memutar:', error);
  }
});

musicBtn.addEventListener('click', async () => {
  const isOpen = musicPanel.classList.contains('show');
  if (!isOpen) {
    musicPanel.classList.add('show');
    musicBtn.textContent = '♫ Tutup lagu';
    try {
      await audio.play();
    } catch (error) {
      console.log('Autoplay diblokir sampai user berinteraksi:', error);
    }
    return;
  }

  musicPanel.classList.remove('show');
  musicBtn.textContent = '♫ Putar lagu';
  audio.pause();
  audio.currentTime = 0;
});
</script>
</body>
</html>
